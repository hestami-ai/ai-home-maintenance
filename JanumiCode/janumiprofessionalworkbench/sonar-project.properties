# SonarQube / SonarLint configuration for JPW.
# Per the Engineering Constitution (tracker §11): scans run headless via the janumicode_v2
# SonarLint driver (see janumicode_v2/docs/sonarqube-headless-remediation-guide.md and the
# .sonar-remediation tooling). Complexity findings are addressed FULLY (NOTA BENE).
sonar.projectKey=janumi-professional-workbench
sonar.projectName=Janumi Professional Workbench (RPH engine)
# SCOPE INCLUDES THE INSTRUMENTS, AND IT DID NOT UNTIL 2026-08-17.
#
# `sonar.sources=packages` left `verif/` (the standing guards, ratchets and vitest setup files), `scripts/`
# (the mutation ledger + runner, the obligations gate, the csaa inventory) and `apps/` outside every scan.
# That is the same shape as REG-F-097 — the check-types blind spot that let a standing ratchet die unwatched
# for two days because nothing typechecked `verif/`. The type half was closed then; this is the analysis half.
#
# The first scan of the newly-included paths found 34 findings in 9 files, including a cognitive complexity of
# 62 in `verif/arrow-command-census.ts` — larger than anything in the product code it audits — and a 21 in
# `scripts/mutants/run.ts`, the mutation runner itself. An instrument nothing measures is an instrument
# nobody can trust.
sonar.sources=packages,apps,verif,scripts
sonar.tests=packages,apps,verif,scripts
sonar.test.inclusions=**/*.test.ts,**/__tests__/**
sonar.exclusions=**/dist/**,**/node_modules/**,**/coverage/**,**/.svelte-kit/**,**/build/**,**/e2e-results/**,**/*.test.ts,**/__tests__/**
sonar.typescript.tsconfigPaths=tsconfig.json,packages/*/tsconfig.json,apps/*/tsconfig.json,verif/tsconfig.json,scripts/tsconfig.json
sonar.sourceEncoding=UTF-8
